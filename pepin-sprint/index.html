<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pépin Sprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Lilita+One&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Pépin <span>Sprint</span></h1>
    <div class="stats">
      <div class="stat"><span class="coin-ico" aria-hidden="true"></span><span id="coins">0</span><small>pièces</small></div>
      <div class="stat"><small>Record</small><span id="best">0 m</span></div>
    </div>
  </header>

  <div class="screen" id="screen">
    <canvas id="game" aria-label="Écran de jeu"></canvas>
    <div class="corner">
      <button class="iconbtn" id="mute" type="button">Son : oui</button>
      <button class="iconbtn" id="pause" type="button" hidden>Pause</button>
    </div>
    <div class="overlay" id="overlay"></div>
  </div>

  <section class="panel missions" aria-labelledby="missions-title">
    <div class="shop-head">
      <div>
        <h2 id="missions-title">Missions du jour</h2>
        <p id="missions-note"></p>
      </div>
    </div>
    <ol class="missions-list" id="missions-list"></ol>
  </section>

  <section class="shop" id="shop" aria-labelledby="shop-title">
    <div class="shop-head">
      <div>
        <h2 id="shop-title">Boutique</h2>
        <p>Gagne des pièces en courant, puis habille Pépin.</p>
      </div>
      <div class="tabs" role="tablist" id="tabs"></div>
    </div>

    <div class="featured" id="featured">
      <h3>À la une aujourd’hui</h3>
      <div class="grid" id="featured-grid"></div>
    </div>

    <div class="grid" id="grid" role="tabpanel"></div>
  </section>

  <footer>Sauter : <kbd>Espace</kbd> ou toucher l'écran (deux fois pour un double saut). Glisser : <kbd>↓</kbd> ou glisser le doigt vers le bas. Pause : <kbd>P</kbd>.</footer>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/catalog.js"></script>
<script src="js/save.js"></script>
<script src="js/audio.js"></script>
<script src="js/scene.js"></script>
<script src="js/character.js"></script>
<script src="js/particles.js"></script>
<script src="js/feel.js"></script>
<script src="js/patterns.js"></script>
<script src="js/difficulty.js"></script>
<script src="js/powerups.js"></script>
<script src="js/combo.js"></script>
<script src="js/biomes.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script src="js/input.js"></script>
<script src="js/missions.js"></script>
<script src="js/shop.js"></script>
<script src="js/debug.js"></script>
<script src="js/main.js"></script>
</body>
</html>
