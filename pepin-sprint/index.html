<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pépin Sprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Lilita+One&display=swap">
<style>
/* Mise en page : une borne d'arcade en colonne. Barre de stats, écran de jeu, puis la boutique en dessous. */
:root {
  --bg: #1b1433;
  --panel: #261d47;
  --panel-2: #31275c;
  --line: #43377a;
  --ink: #f6eefe;
  --muted: #b4a6d4;
  --accent: #ffb35c;
  --accent-ink: #2a1606;
  --accent-shadow: #c97a2a;
  --coin: #ffd447;
  --r-commun: #c3cbd8;
  --r-rare: #6cc0ff;
  --r-epique: #cf96ff;
  --r-legendaire: #ffc93d;
  --f-display: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --f-body: "Fredoka", ui-rounded, system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font-family: var(--f-body); font-size: 16px; line-height: 1.45; }
.wrap { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 20px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 5vw, 42px); line-height: 1; margin: 0; color: var(--accent); letter-spacing: .01em; text-wrap: balance; }
h1 span { color: var(--ink); }
.stats { display: flex; gap: 8px; flex-wrap: wrap; }
.stat { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .08em; font-size: 11px; }
.coin-ico { width: 16px; height: 16px; flex: none; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff4b8, var(--coin) 55%, #d79a12); box-shadow: inset 0 0 0 2px #e0a817; }

.screen { position: relative; border-radius: 18px; overflow: hidden; border: 3px solid var(--line); aspect-ratio: 16 / 7; max-width: 100%; touch-action: manipulation; user-select: none; -webkit-user-select: none; cursor: pointer; background: var(--panel); }
@media (max-width: 640px) { .screen { aspect-ratio: 4 / 3; } }
#game { display: block; width: 100%; height: 100%; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; background: rgba(20, 12, 40, .42); }
.overlay-card { display: grid; gap: 10px; justify-items: center; max-width: 34ch; }
.overlay h2 { font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 6vw, 52px); line-height: 1; margin: 0; color: #fff; text-shadow: 0 4px 0 rgba(0, 0, 0, .25); text-wrap: balance; }
.overlay p { margin: 0; color: #f3ecff; text-shadow: 0 1px 2px rgba(0, 0, 0, .4); }
.overlay .big { font-family: var(--f-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.overlay .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.record { background: var(--coin); color: var(--accent-ink); font-weight: 600; font-size: 13px; padding: 2px 10px; border-radius: 999px; text-transform: uppercase; letter-spacing: .08em; }
.hint { font-size: 13px; }
kbd { font-family: var(--f-body); font-weight: 600; font-size: 12px; background: rgba(255, 255, 255, .18); border: 1px solid rgba(255, 255, 255, .35); border-bottom-width: 3px; border-radius: 6px; padding: 0 6px; }
.corner { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; }
.iconbtn { font: inherit; font-weight: 600; font-size: 13px; border: 0; border-radius: 999px; padding: 5px 11px; background: rgba(20, 12, 40, .5); color: #fff; cursor: pointer; }

.btn { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 10px 20px; cursor: pointer; background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 0 var(--accent-shadow); transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-shadow); }
.btn.ghost { background: rgba(20, 12, 40, .55); color: #fff; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .45); }
.btn.small { padding: 7px 12px; font-size: 14px; border-radius: 10px; }
.btn[disabled] { background: var(--panel); color: var(--muted); box-shadow: none; cursor: not-allowed; transform: none; }
.btn:focus-visible, .tab:focus-visible, .iconbtn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

.shop { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px 16px; display: grid; gap: 16px; }
.shop-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.shop h2 { font-family: var(--f-display); font-weight: 400; font-size: 28px; margin: 0; line-height: 1.1; }
.shop-head p { margin: 2px 0 0; color: var(--muted); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 7px 14px; background: var(--panel-2); color: var(--muted); cursor: pointer; display: flex; gap: 6px; align-items: center; }
.tab .count { font-size: 12px; opacity: .8; font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }

.chest { display: flex; align-items: center; gap: 14px; background: var(--panel-2); border-radius: 14px; padding: 12px; flex-wrap: wrap; }
.chest canvas { width: 72px; height: 60px; flex: none; }
.chest-text { flex: 1 1 200px; min-width: 0; }
.chest-text strong { font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.chest-text p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.odds { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; margin-top: 4px; font-variant-numeric: tabular-nums; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.item { background: var(--panel-2); border-radius: 14px; padding: 10px; display: grid; gap: 8px; border: 2px solid transparent; align-content: start; }
.item.equipped { border-color: var(--accent); }
.item canvas { width: 100%; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 9px; display: block; }
.item-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
.item .name { font-weight: 600; line-height: 1.2; }
.chip { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; padding: 1px 7px; border-radius: 999px; border: 1.5px solid currentColor; white-space: nowrap; }
.r-commun { color: var(--r-commun); }
.r-rare { color: var(--r-rare); }
.r-epique { color: var(--r-epique); }
.r-legendaire { color: var(--r-legendaire); }
.item .btn { width: 100%; display: flex; gap: 6px; justify-content: center; align-items: center; }

.modal { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(10, 6, 24, .72); z-index: 10; }
.modal-card { background: var(--panel); border: 2px solid var(--line); border-radius: 20px; padding: 20px; display: grid; gap: 12px; justify-items: center; text-align: center; width: min(340px, 100%); }
.modal-card canvas { width: 100%; max-width: 260px; aspect-ratio: 4 / 3; border-radius: 12px; }
.modal-card h3 { font-family: var(--f-display); font-weight: 400; font-size: 28px; margin: 0; line-height: 1.1; }
.modal-card .row { display: flex; gap: 8px; }
.glow { animation: pop .5s cubic-bezier(.2, 1.6, .4, 1); box-shadow: 0 0 0 3px currentColor, 0 0 40px currentColor; }
.shaking { animation: shake .12s infinite; }
@keyframes pop { from { transform: scale(.6); } to { transform: scale(1); } }
@keyframes shake { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); font-weight: 600; padding: 9px 16px; border-radius: 999px; z-index: 20; max-width: calc(100% - 32px); text-align: center; }
footer { color: var(--muted); font-size: 13px; text-align: center; }

@media (prefers-reduced-motion: reduce) {
  .glow, .shaking { animation: none; }
  .btn { transition: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Pépin <span>Sprint</span></h1>
    <div class="stats">
      <div class="stat"><span class="coin-ico" aria-hidden="true"></span><span id="coins">0</span><small>pièces</small></div>
      <div class="stat"><small>Record</small><span id="best">0 m</span></div>
    </div>
  </header>

  <div class="screen" id="screen">
    <canvas id="game" aria-label="Écran de jeu"></canvas>
    <div class="corner">
      <button class="iconbtn" id="mute" type="button">Son : oui</button>
      <button class="iconbtn" id="pause" type="button" hidden>Pause</button>
    </div>
    <div class="overlay" id="overlay"></div>
  </div>

  <section class="shop" id="shop" aria-labelledby="shop-title">
    <div class="shop-head">
      <div>
        <h2 id="shop-title">Boutique</h2>
        <p>Gagne des pièces en courant, puis habille Pépin.</p>
      </div>
      <div class="tabs" role="tablist" id="tabs"></div>
    </div>

    <div class="chest">
      <canvas id="chest-art" width="144" height="120" aria-hidden="true"></canvas>
      <div class="chest-text">
        <strong>Coffre mystère</strong>
        <p>Un objet que tu n'as pas encore, au hasard.</p>
        <div class="odds">
          <span class="r-commun">Commun 55 %</span>
          <span class="r-rare">Rare 30 %</span>
          <span class="r-epique">Épique 12 %</span>
          <span class="r-legendaire">Légendaire 3 %</span>
        </div>
      </div>
      <button class="btn" id="open-chest" type="button"></button>
    </div>

    <div class="grid" id="grid" role="tabpanel"></div>
  </section>

  <footer>Espace, flèche du haut ou toucher l'écran pour sauter. Deux sauts possibles. <kbd>P</kbd> pour la pause.</footer>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-card">
    <canvas id="reveal" aria-hidden="true"></canvas>
    <span class="chip" id="reveal-chip"></span>
    <h3 id="reveal-name"></h3>
    <p id="reveal-cat" style="margin:0;color:var(--muted)"></p>
    <div class="row">
      <button class="btn" id="reveal-equip" type="button">Équiper</button>
      <button class="btn ghost" id="reveal-close" type="button">Fermer</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
'use strict';

// ---------- Catalogue ----------
const RAR = {
  commun: { label: 'Commun', weight: 55 },
  rare: { label: 'Rare', weight: 30 },
  epique: { label: 'Épique', weight: 12 },
  legendaire: { label: 'Légendaire', weight: 3 },
};
const CATS = [
  { id: 'skin', label: 'Personnages', one: 'Personnage' },
  { id: 'hat', label: 'Chapeaux', one: 'Chapeau' },
  { id: 'trail', label: 'Traînées', one: 'Traînée' },
  { id: 'bg', label: 'Décors', one: 'Décor' },
];
const CAT = {
  skin: [
    { id: 'pepin', name: 'Pépin', rar: 'commun', price: 0, kind: 'blob', body: '#ff9f5a', belly: '#ffdcb5', feet: '#7a3b1c' },
    { id: 'menthe', name: 'Menthe', rar: 'commun', price: 120, kind: 'blob', body: '#5fd3a6', belly: '#cdf6e4', feet: '#1f6b50' },
    { id: 'prune', name: 'Prune', rar: 'rare', price: 300, kind: 'blob', body: '#9b6bff', belly: '#e0d0ff', feet: '#3f2385' },
    { id: 'robo', name: 'Robo', rar: 'rare', price: 350, kind: 'robot', body: '#a9bccf', belly: null, feet: '#4a5a6b' },
    { id: 'fantome', name: 'Fantôme', rar: 'epique', price: 700, kind: 'ghost', body: '#f4f0ff', belly: null, feet: null },
    { id: 'lave', name: 'Lave', rar: 'epique', price: 800, kind: 'blob', body: 'lava', belly: '#ffe08a', feet: '#5a1410' },
    { id: 'galaxie', name: 'Galaxie', rar: 'legendaire', price: 1600, kind: 'blob', body: 'galaxy', belly: null, feet: '#1c0742' },
  ],
  hat: [
    { id: 'aucun', name: 'Tête nue', rar: 'commun', price: 0 },
    { id: 'casquette', name: 'Casquette', rar: 'commun', price: 100 },
    { id: 'bonnet', name: 'Bonnet', rar: 'commun', price: 140 },
    { id: 'chat', name: 'Oreilles de chat', rar: 'rare', price: 280 },
    { id: 'sorcier', name: 'Chapeau de sorcier', rar: 'epique', price: 650 },
    { id: 'aureole', name: 'Auréole', rar: 'epique', price: 750 },
    { id: 'couronne', name: 'Couronne', rar: 'legendaire', price: 1500 },
  ],
  trail: [
    { id: 'poussiere', name: 'Poussière', rar: 'commun', price: 0 },
    { id: 'bulles', name: 'Bulles', rar: 'commun', price: 150 },
    { id: 'coeurs', name: 'Cœurs', rar: 'rare', price: 320 },
    { id: 'etoiles', name: 'Étoiles', rar: 'rare', price: 380 },
    { id: 'flammes', name: 'Flammes', rar: 'epique', price: 720 },
    { id: 'arcenciel', name: 'Arc-en-ciel', rar: 'legendaire', price: 1500 },
  ],
  bg: [
    { id: 'crepuscule', name: 'Crépuscule', rar: 'commun', price: 0 },
    { id: 'foret', name: 'Forêt d’automne', rar: 'commun', price: 160 },
    { id: 'ocean', name: 'Plage de nuit', rar: 'rare', price: 300 },
    { id: 'neige', name: 'Montagne enneigée', rar: 'rare', price: 360 },
    { id: 'cosmos', name: 'Cosmos', rar: 'legendaire', price: 1400 },
  ],
};
const BG = {
  crepuscule: { sky: ['#2d1f5e', '#ff8f7a'], sun: { c: '#ffd29a', x: .74, y: .42, r: 44 }, far: '#6a4a9c', near: '#4a3480', ground: '#2a1d4a', top: '#ff9f5a', obs: '#170e2e', obsHi: '#ffb35c', bird: '#2a1b4d', deco: 'clouds', decoC: 'rgba(255,225,235,.5)', dust: 'rgba(255,220,200,.7)' },
  foret: { sky: ['#f4a76a', '#fde3b0'], sun: { c: '#fff2c4', x: .22, y: .3, r: 34 }, far: '#c8794a', near: '#8f4b2c', ground: '#4a2a1a', top: '#d9893e', obs: '#3a2214', obsHi: '#7a4a2c', bird: '#4b2d6b', deco: 'leaves', decoC: '#e05a2b', dust: 'rgba(255,230,190,.75)' },
  ocean: { sky: ['#081a3a', '#1f4f8a'], sun: { c: '#eef3ff', x: .8, y: .3, r: 26 }, far: '#174a7a', near: '#1d6aa0', ground: '#d9bd84', top: '#f0dcad', obs: '#5b4636', obsHi: '#9a7b5f', bird: '#ffcf6b', deco: 'stars', decoC: '#ffffff', dust: 'rgba(255,240,210,.8)' },
  neige: { sky: ['#8fbdea', '#eef6ff'], sun: { c: '#ffffff', x: .25, y: .3, r: 30 }, far: '#d8e7f7', near: '#b5cde8', ground: '#f7fbff', top: '#dbe8f6', obs: '#3d5a7c', obsHi: '#8fb0d6', bird: '#33557a', deco: 'snow', decoC: '#ffffff', dust: 'rgba(160,190,225,.8)' },
  cosmos: { sky: ['#0c0526', '#3b0f73'], sun: { c: '#ff7ad9', x: .78, y: .34, r: 38, ring: true }, far: '#2b1460', near: '#4a1f8f', ground: '#1a0b3d', top: '#7df9ff', obs: '#ff5fa2', obsHi: '#ffb3d6', bird: '#7df9ff', deco: 'stars', decoC: '#ffffff', dust: 'rgba(125,249,255,.7)' },
};
const find = (cat, id) => CAT[cat].find(i => i.id === id) || CAT[cat][0];

// ---------- Sauvegarde ----------
const KEY = 'pepin-sprint-v1';
const DEF = () => ({
  coins: 0, best: 0, muted: false,
  owned: { skin: ['pepin'], hat: ['aucun'], trail: ['poussiere'], bg: ['crepuscule'] },
  eq: { skin: 'pepin', hat: 'aucun', trail: 'poussiere', bg: 'crepuscule' },
});
function normalize(s) {
  const d = DEF();
  if (!s || typeof s !== 'object') return d;
  const out = { ...d, ...s, owned: { ...d.owned }, eq: { ...d.eq } };
  for (const c of CATS) {
    const own = Array.isArray(s.owned?.[c.id]) ? s.owned[c.id].filter(id => CAT[c.id].some(i => i.id === id)) : [];
    out.owned[c.id] = [...new Set([...d.owned[c.id], ...own])];
    const e = s.eq?.[c.id];
    out.eq[c.id] = out.owned[c.id].includes(e) ? e : d.eq[c.id];
  }
  out.coins = Math.max(0, Math.floor(+s.coins || 0));
  out.best = Math.max(0, Math.floor(+s.best || 0));
  out.muted = !!s.muted;
  return out;
}
function load() {
  try { return normalize(JSON.parse(localStorage.getItem(KEY))); } catch (e) { return DEF(); }
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) { /* stockage indisponible : la partie continue en mémoire */ }
}
let save = load();

// ---------- Utilitaires ----------
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const fmt = n => n.toLocaleString('fr-FR');

function rr(c, x, y, w, h, r) {
  c.beginPath();
  if (c.roundRect) c.roundRect(x, y, w, h, r);
  else c.rect(x, y, w, h);
}

// ---------- Son ----------
let ac = null;
function beep(f1, f2, dur, type = 'square', vol = .05, delay = 0) {
  if (save.muted) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t0);
    o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(ac.destination);
    o.start(t0); o.stop(t0 + dur + .02);
  } catch (e) { /* pas d'audio */ }
}
const sfx = {
  jump: () => beep(380, 720, .13, 'square', .035),
  jump2: () => beep(560, 1040, .12, 'square', .03),
  coin: () => { beep(988, 988, .06, 'triangle', .05); beep(1319, 1319, .1, 'triangle', .05, .06); },
  die: () => beep(320, 70, .45, 'sawtooth', .045),
  buy: () => { beep(523, 523, .1, 'triangle', .05); beep(659, 659, .1, 'triangle', .05, .1); beep(784, 784, .18, 'triangle', .05, .2); },
  chest: () => { [523, 659, 784, 1047].forEach((f, i) => beep(f, f, .14, 'triangle', .05, i * .09)); },
};

// ---------- Dessin : décor ----------
const DECO = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), s: Math.random(), p: Math.random() * 6.28 }));

function hills(c, w, gy, off, base, amp, freq, color) {
  c.fillStyle = color;
  c.beginPath();
  c.moveTo(0, gy);
  for (let x = 0; x <= w + 8; x += 8) {
    const X = x + off;
    c.lineTo(x, base - (Math.sin(X * freq) * .6 + Math.sin(X * freq * 2.3 + 1.7) * .4) * amp);
  }
  c.lineTo(w, gy);
  c.closePath();
  c.fill();
}

function drawScene(c, w, h, bgId, scroll, t, gy) {
  const b = BG[bgId] || BG.crepuscule;
  const k = h / 320;
  const sky = c.createLinearGradient(0, 0, 0, gy);
  sky.addColorStop(0, b.sky[0]);
  sky.addColorStop(1, b.sky[1]);
  c.fillStyle = sky;
  c.fillRect(0, 0, w, h);

  // Décor lointain
  if (b.deco === 'stars') {
    for (const d of DECO) {
      const x = ((d.x * w - scroll * .02) % w + w) % w;
      c.globalAlpha = .35 + .65 * Math.abs(Math.sin(t * 1.5 + d.p));
      c.fillStyle = b.decoC;
      c.fillRect(x, d.y * gy * .75, 1 + d.s * 1.6 * k, 1 + d.s * 1.6 * k);
    }
    c.globalAlpha = 1;
  }

  // Soleil, lune ou planète
  const s = b.sun, sx = s.x * w, sy = s.y * gy, sr = s.r * k;
  c.save();
  c.shadowColor = s.c;
  c.shadowBlur = 30 * k;
  c.fillStyle = s.c;
  c.beginPath(); c.arc(sx, sy, sr, 0, 6.283); c.fill();
  c.restore();
  if (s.ring) {
    c.strokeStyle = 'rgba(255,220,250,.75)';
    c.lineWidth = 4 * k;
    c.beginPath(); c.ellipse(sx, sy, sr * 1.8, sr * .45, -.35, 0, 6.283); c.stroke();
  }

  if (b.deco === 'clouds') {
    c.fillStyle = b.decoC;
    for (let i = 0; i < 5; i++) {
      const d = DECO[i];
      const cw = (60 + d.s * 60) * k;
      const x = ((d.x * (w + cw * 2) - scroll * .08) % (w + cw * 2) + (w + cw * 2)) % (w + cw * 2) - cw;
      const y = (20 + d.y * 80) * k;
      c.beginPath();
      c.ellipse(x, y, cw * .5, 10 * k, 0, 0, 6.283);
      c.ellipse(x - cw * .15, y - 7 * k, cw * .25, 10 * k, 0, 0, 6.283);
      c.ellipse(x + cw * .15, y - 5 * k, cw * .2, 8 * k, 0, 0, 6.283);
      c.fill();
    }
  }

  hills(c, w, gy, scroll * .15, gy - 62 * k, 28 * k, .006 / k, b.far);
  hills(c, w, gy, scroll * .35, gy - 22 * k, 16 * k, .011 / k, b.near);

  // Sol
  c.fillStyle = b.ground;
  c.fillRect(0, gy, w, h - gy);
  c.fillStyle = b.top;
  c.fillRect(0, gy, w, 6 * k);
  c.fillStyle = b.obsHi;
  c.globalAlpha = .35;
  const step = 46 * k;
  for (let x = -(scroll % step); x < w; x += step) {
    c.fillRect(x, gy + 16 * k, 14 * k, 3 * k);
    c.fillRect(x + step * .5, gy + 30 * k, 8 * k, 3 * k);
  }
  c.globalAlpha = 1;

  // Décor proche
  if (b.deco === 'snow') {
    c.fillStyle = b.decoC;
    for (const d of DECO) {
      const y = ((d.y * h + t * (20 + d.s * 30) * k) % h);
      const x = ((d.x * w + Math.sin(t + d.p) * 10 * k - scroll * .05) % w + w) % w;
      c.beginPath(); c.arc(x, y, (1 + d.s * 2) * k, 0, 6.283); c.fill();
    }
  } else if (b.deco === 'leaves') {
    c.fillStyle = b.decoC;
    for (let i = 0; i < 18; i++) {
      const d = DECO[i];
      const y = ((d.y * h + t * (24 + d.s * 20) * k) % h);
      const x = ((d.x * w + Math.sin(t * 1.3 + d.p) * 14 * k - scroll * .3) % w + w) % w;
      c.save(); c.translate(x, y); c.rotate(t * 2 + d.p);
      c.beginPath(); c.ellipse(0, 0, 5 * k, 2.5 * k, 0, 0, 6.283); c.fill();
      c.restore();
    }
  }
}

// ---------- Dessin : personnage ----------
function bodyFill(c, sk, s, t) {
  if (sk.body === 'lava') {
    const g = c.createLinearGradient(0, -s, 0, 0);
    const m = .45 + Math.sin(t * 3) * .12;
    g.addColorStop(0, '#ffd45a'); g.addColorStop(m, '#ff6a2b'); g.addColorStop(1, '#b3241a');
    return g;
  }
  if (sk.body === 'galaxy') {
    const g = c.createLinearGradient(-s / 2, -s, s / 2, 0);
    g.addColorStop(0, '#2b0c8f'); g.addColorStop(.5, '#7a12c4'); g.addColorStop(1, '#f72585');
    return g;
  }
  return sk.body;
}
function bodyPath(c, kind, w, h, t) {
  c.beginPath();
  if (kind === 'robot') {
    if (c.roundRect) c.roundRect(-w / 2, -h, w, h - 3, 9); else c.rect(-w / 2, -h, w, h - 3);
  } else if (kind === 'ghost') {
    c.moveTo(-w / 2, -h + w / 2);
    c.arc(0, -h + w / 2, w / 2, Math.PI, 0);
    c.lineTo(w / 2, -4);
    const n = 4;
    for (let i = 0; i < n; i++) {
      const x1 = w / 2 - (i + .5) * w / n, x2 = w / 2 - (i + 1) * w / n;
      c.quadraticCurveTo(x1, 6 + Math.sin(t * 9 + i) * 3, x2, -4);
    }
    c.closePath();
  } else {
    if (c.roundRect) c.roundRect(-w / 2, -h, w, h - 3, [w * .5, w * .5, w * .3, w * .3]); else c.rect(-w / 2, -h, w, h - 3);
  }
}
function drawChar(c, x, y, s, t, eq, o = {}) {
  const sk = find('skin', eq.skin);
  const run = o.run || 0;
  const w = s, h = s;
  c.save();
  c.translate(x, y);
  const sq = o.squash || 0;
  c.scale(1 + sq * .2, 1 - sq * .2);
  if (sk.kind === 'ghost') c.translate(0, -6 + Math.sin(t * 4) * 3);
  else if (!o.air) c.translate(0, -Math.abs(Math.sin(run)) * 3);
  else c.rotate(o.spin || 0);

  // Pieds
  if (sk.feet) {
    const f = o.air ? 3 : Math.sin(run) * 6;
    c.fillStyle = sk.feet;
    c.beginPath(); c.ellipse(-w * .2 + f, -2, 7, 4, 0, 0, 6.283); c.fill();
    c.beginPath(); c.ellipse(w * .2 - f, -2, 7, 4, 0, 0, 6.283); c.fill();
  }

  // Corps
  c.globalAlpha = sk.kind === 'ghost' ? .93 : 1;
  c.fillStyle = bodyFill(c, sk, s, t);
  bodyPath(c, sk.kind, w, h, t);
  c.fill();
  c.globalAlpha = 1;
  if (sk.body === 'galaxy') {
    c.save();
    bodyPath(c, sk.kind, w, h, t);
    c.clip();
    c.fillStyle = '#fff';
    for (let i = 0; i < 9; i++) {
      const d = DECO[i + 20];
      c.globalAlpha = .4 + .6 * Math.abs(Math.sin(t * 2 + d.p));
      c.beginPath(); c.arc(-w / 2 + d.x * w, -h + d.y * h, .8 + d.s * 1.4, 0, 6.283); c.fill();
    }
    c.restore();
  }
  if (sk.belly) {
    c.fillStyle = sk.belly;
    c.beginPath(); c.ellipse(w * .06, -h * .3, w * .27, h * .2, 0, 0, 6.283); c.fill();
  }
  if (sk.kind === 'robot') {
    c.fillStyle = '#5d6f82';
    c.fillRect(-w * .3, -h * .3, w * .6, 4);
    c.fillRect(-w * .3, -h * .2, w * .4, 4);
    c.strokeStyle = '#5d6f82'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(0, -h); c.lineTo(0, -h - 9); c.stroke();
    c.fillStyle = (t % 1) < .5 ? '#ff5f7a' : '#ff9fb0';
    c.beginPath(); c.arc(0, -h - 11, 4, 0, 6.283); c.fill();
  }

  // Yeux
  const blink = (t % 3.3) < .13;
  if (sk.kind === 'robot') {
    c.fillStyle = '#1b2533';
    rr(c, -w * .1, -h * .78, w * .52, h * .26, 6); c.fill();
    c.fillStyle = '#62f4ff';
    const eh = blink ? 1.5 : 5;
    c.fillRect(w * .02, -h * .65 - eh / 2, 6, eh);
    c.fillRect(w * .22, -h * .65 - eh / 2, 6, eh);
  } else {
    const ey = -h * .62;
    for (const ex of [w * .06, w * .3]) {
      c.fillStyle = '#fff';
      c.beginPath(); c.ellipse(ex, ey, 5.5, blink ? 1 : 7, 0, 0, 6.283); c.fill();
      if (!blink) {
        c.fillStyle = '#1b1433';
        c.beginPath(); c.arc(ex + 1.8, ey + .5, 3.2, 0, 6.283); c.fill();
        c.fillStyle = '#fff';
        c.beginPath(); c.arc(ex + 2.8, ey - 1, 1.1, 0, 6.283); c.fill();
      }
    }
    c.fillStyle = 'rgba(255,90,130,.38)';
    c.beginPath(); c.ellipse(w * .4, -h * .44, 4, 2.5, 0, 0, 6.283); c.fill();
  }

  drawHat(c, eq.hat, sk, w, h, t, s);
  c.restore();
}
function drawHat(c, id, sk, w, h, t, s) {
  const top = -h;
  switch (id) {
    case 'casquette':
      c.fillStyle = '#e8414f';
      c.beginPath(); c.arc(0, top + 5, w * .36, Math.PI, 0); c.fill();
      c.fillStyle = '#b52f3b';
      c.beginPath(); c.ellipse(w * .3, top + 4, w * .26, 4, 0, 0, 6.283); c.fill();
      c.fillStyle = '#fff';
      c.beginPath(); c.arc(0, top + 5 - w * .36, 2.5, 0, 6.283); c.fill();
      break;
    case 'bonnet':
      c.fillStyle = '#3d7bff';
      c.beginPath(); c.arc(0, top + 7, w * .38, Math.PI, 0); c.fill();
      c.fillStyle = '#2858c9';
      rr(c, -w * .41, top + 2, w * .82, 8, 4); c.fill();
      c.fillStyle = '#fff';
      c.beginPath(); c.arc(Math.sin(t * 6) * 1.5, top + 7 - w * .38 - 3, 6, 0, 6.283); c.fill();
      break;
    case 'chat':
      for (const sgn of [-1, 1]) {
        c.fillStyle = bodyFill(c, sk, s, t);
        c.beginPath();
        c.moveTo(sgn * w * .4, top + 12); c.lineTo(sgn * w * .3, top - 12); c.lineTo(sgn * w * .08, top + 5);
        c.closePath(); c.fill();
        c.fillStyle = '#ff9ec4';
        c.beginPath();
        c.moveTo(sgn * w * .34, top + 9); c.lineTo(sgn * w * .29, top - 5); c.lineTo(sgn * w * .16, top + 5);
        c.closePath(); c.fill();
      }
      break;
    case 'sorcier': {
      const tip = Math.sin(t * 3) * 3;
      c.fillStyle = '#4b2a8a';
      c.beginPath();
      c.moveTo(-w * .3, top + 4); c.lineTo(w * .3, top + 4);
      c.quadraticCurveTo(w * .05, top - w * .5, -w * .2 + tip, top - w * .85);
      c.closePath(); c.fill();
      c.beginPath(); c.ellipse(0, top + 4, w * .5, 5, 0, 0, 6.283); c.fill();
      c.fillStyle = '#ffd447';
      c.fillRect(-w * .27, top - 2, w * .54, 5);
      star(c, w * .02, top - w * .32, 5, 2.2, '#ffd447', t);
      break;
    }
    case 'aureole':
      c.save();
      c.shadowColor = '#fff1a0'; c.shadowBlur = 14;
      c.strokeStyle = '#ffe680'; c.lineWidth = 4;
      c.beginPath(); c.ellipse(0, top - 10 + Math.sin(t * 3) * 2, w * .3, 6, 0, 0, 6.283); c.stroke();
      c.restore();
      break;
    case 'couronne':
      c.fillStyle = '#ffd447';
      c.strokeStyle = '#d79a12'; c.lineWidth = 2;
      c.beginPath();
      c.moveTo(-w * .3, top + 6);
      c.lineTo(-w * .32, top - 12); c.lineTo(-w * .15, top - 2);
      c.lineTo(0, top - 17); c.lineTo(w * .15, top - 2);
      c.lineTo(w * .32, top - 12); c.lineTo(w * .3, top + 6);
      c.closePath(); c.fill(); c.stroke();
      c.fillStyle = '#ff4d6d'; c.beginPath(); c.arc(0, top - 1, 3, 0, 6.283); c.fill();
      c.fillStyle = '#4dabf7'; c.beginPath(); c.arc(-w * .18, top + 1, 2.2, 0, 6.283); c.fill();
      c.beginPath(); c.arc(w * .18, top + 1, 2.2, 0, 6.283); c.fill();
      break;
  }
}
function star(c, x, y, r, ir, color, rot) {
  c.save(); c.translate(x, y); c.rotate(rot || 0);
  c.fillStyle = color;
  c.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = i * Math.PI / 5 - Math.PI / 2, rad = i % 2 ? ir : r;
    c.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
  }
  c.closePath(); c.fill(); c.restore();
}
function heart(c, x, y, s, color) {
  c.save(); c.translate(x, y); c.scale(s / 10, s / 10);
  c.fillStyle = color;
  c.beginPath();
  c.moveTo(0, 3);
  c.bezierCurveTo(-10, -4, -5, -11, 0, -5);
  c.bezierCurveTo(5, -11, 10, -4, 0, 3);
  c.fill(); c.restore();
}

// ---------- Particules et traînées ----------
const RAINBOW = ['#ff5e5e', '#ffa94d', '#ffe066', '#69db7c', '#4dabf7', '#9775fa'];
function emitTrail(parts, id, x, y, onGround, speed) {
  const R = Math.random;
  switch (id) {
    case 'poussiere':
      if (onGround && R() < .55) parts.push({ k: 'dust', x, y: y + 18, vx: -speed * .6 - 30 * R(), vy: -20 - 40 * R(), life: 0, max: .45, s: 3 + R() * 4 });
      break;
    case 'bulles':
      if (R() < .3) parts.push({ k: 'bub', x, y: y + rnd(-12, 12), vx: -speed * .7, vy: -20 - 30 * R(), life: 0, max: 1.1, s: 3 + R() * 6 });
      break;
    case 'coeurs':
      if (R() < .2) parts.push({ k: 'heart', x, y: y + rnd(-10, 10), vx: -speed * .75, vy: -25 - 20 * R(), life: 0, max: 1, s: 8 + R() * 5, c: pick(['#ff6b9a', '#ff9ec4', '#ff4d7a']) });
      break;
    case 'etoiles':
      if (R() < .4) parts.push({ k: 'star', x, y: y + rnd(-14, 14), vx: -speed * .8, vy: rnd(-20, 20), life: 0, max: .8, s: 3 + R() * 4, rot: R() * 6, vr: rnd(-6, 6), c: pick(['#fff6a8', '#ffffff', '#ffd447']) });
      break;
    case 'flammes':
      for (let i = 0; i < 2; i++) parts.push({ k: 'fire', x: x + rnd(-3, 3), y: y + rnd(-8, 10), vx: -speed * .7 - 40 * R(), vy: -50 - 40 * R(), life: 0, max: .38 + R() * .15, s: 7 + R() * 6 });
      break;
    case 'arcenciel':
      if (R() < .15) parts.push({ k: 'star', x: x - 10, y: y + rnd(-14, 14), vx: -speed * .9, vy: 0, life: 0, max: .6, s: 2.5, rot: 0, vr: 4, c: '#ffffff' });
      break;
  }
}
function stepParts(parts, dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life += dt;
    if (p.life >= p.max) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.rot !== undefined) p.rot += (p.vr || 0) * dt;
    if (p.k === 'spark') p.vy += 500 * dt;
  }
}
function drawParts(c, parts, bgId) {
  const b = BG[bgId] || BG.crepuscule;
  for (const p of parts) {
    const a = 1 - p.life / p.max;
    c.globalAlpha = Math.max(0, a);
    switch (p.k) {
      case 'dust':
        c.fillStyle = b.dust;
        c.beginPath(); c.arc(p.x, p.y, p.s * (1.4 - a * .4), 0, 6.283); c.fill();
        break;
      case 'bub':
        c.strokeStyle = '#bfeaff'; c.lineWidth = 1.5;
        c.beginPath(); c.arc(p.x, p.y, p.s, 0, 6.283); c.stroke();
        c.fillStyle = '#ffffff';
        c.beginPath(); c.arc(p.x - p.s * .35, p.y - p.s * .35, p.s * .22, 0, 6.283); c.fill();
        break;
      case 'heart': heart(c, p.x, p.y, p.s, p.c); break;
      case 'star': star(c, p.x, p.y, p.s, p.s * .45, p.c, p.rot); break;
      case 'fire': {
        c.save();
        c.globalCompositeOperation = 'lighter';
        c.fillStyle = a > .7 ? '#fff1a0' : a > .4 ? '#ff9b2b' : '#ff3b2b';
        c.beginPath(); c.arc(p.x, p.y, p.s * a, 0, 6.283); c.fill();
        c.restore();
        break;
      }
      case 'spark':
        c.fillStyle = '#ffe066';
        c.fillRect(p.x - 2, p.y - 2, 4, 4);
        break;
      case 'puff':
        c.strokeStyle = '#ffffff'; c.lineWidth = 2;
        c.beginPath(); c.arc(p.x, p.y, p.s + (1 - a) * 18, 0, 6.283); c.stroke();
        break;
    }
  }
  c.globalAlpha = 1;
}
function drawRainbow(c, hist, px, dist) {
  for (let i = hist.length - 1; i > 0; i--) {
    const h1 = hist[i], h0 = hist[i - 1];
    const x1 = px - (dist - h1.d), x0 = px - (dist - h0.d);
    if (x1 < -10) break;
    for (let j = 0; j < 6; j++) {
      c.fillStyle = RAINBOW[j];
      const wob = (Math.floor(h1.d / 24) % 2) ? 1.5 : -1.5;
      c.fillRect(x0, h1.y - 15 + j * 4 + wob, x1 - x0 + 1, 4);
    }
  }
}

// ---------- Aperçus (boutique) ----------
function renderPreview(cv, cat, id, w = 200, h = 150) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = w * dpr; cv.height = h * dpr;
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const eq = { ...save.eq, [cat]: id };
  const gy = h * .8;
  drawScene(c, w, h, eq.bg, 60, 1.2, gy);
  const px = cat === 'trail' ? w * .66 : w / 2;
  const s = h * .32;
  if (cat === 'trail') {
    const parts = [], hist = [];
    let d = 0;
    const sp = 170;
    for (let i = 0; i < 60; i++) {
      const y = gy - s * .5;
      emitTrail(parts, id, px - s * .4, y, true, sp);
      stepParts(parts, 1 / 60);
      d += sp / 60;
      hist.push({ d, y });
    }
    if (id === 'arcenciel') drawRainbow(c, hist, px - s * .3, d);
    drawParts(c, parts, eq.bg);
  }
  drawChar(c, px, gy, s, 1.0, eq, { run: .7 });
}
function drawChestArt() {
  const cv = $('chest-art'), c = cv.getContext('2d');
  c.clearRect(0, 0, 144, 120);
  c.save(); c.scale(2, 2);
  c.fillStyle = 'rgba(0,0,0,.25)';
  c.beginPath(); c.ellipse(36, 54, 28, 5, 0, 0, 6.283); c.fill();
  c.fillStyle = '#8a4b26'; rr(c, 10, 26, 52, 28, 4); c.fill();
  c.fillStyle = '#a65d30'; c.beginPath(); c.moveTo(10, 28); c.quadraticCurveTo(36, 4, 62, 28); c.closePath(); c.fill();
  c.fillStyle = '#ffd447';
  c.fillRect(10, 26, 52, 5);
  c.fillRect(20, 14, 5, 40); c.fillRect(47, 14, 5, 40);
  rr(c, 31, 28, 10, 12, 2); c.fill();
  c.fillStyle = '#5a2e14'; c.fillRect(35, 33, 2, 4);
  c.restore();
}

// ---------- Jeu ----------
const cv = $('game'), ctx = cv.getContext('2d');
const H = 320, GROUND = H - 56, PX = 96, S = 44;
const GRAV = 2300, JUMP = 780;
let W = 800;
const G = {
  state: 'menu', t: 0, runT: 0, speed: 0, dist: 0, score: 0, coinsRun: 0,
  py: GROUND, vy: 0, ground: true, jumps: 0, squash: 0, spin: 0,
  obs: [], coins: [], parts: [], hist: [], nextSpawn: 0, shake: 0, overAt: 0, lastResult: null,
};

function resize() {
  const r = cv.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(360, Math.round(H * r.width / r.height));
  cv.width = Math.round(r.width * dpr);
  cv.height = Math.round(r.height * dpr);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
}
new ResizeObserver(resize).observe(cv);

function startRun() {
  Object.assign(G, {
    state: 'play', runT: 0, speed: 340, dist: 0, score: 0, coinsRun: 0,
    py: GROUND, vy: 0, ground: true, jumps: 0, squash: 0, spin: 0,
    obs: [], coins: [], hist: [], nextSpawn: 420, shake: 0,
  });
  $('pause').hidden = false;
  showOverlay(null);
}
function jumpPress() {
  if (G.state !== 'play') return;
  if (G.ground) {
    G.vy = -JUMP; G.ground = false; G.jumps = 1;
    sfx.jump();
  } else if (G.jumps < 2) {
    G.vy = -JUMP * .85; G.jumps = 2; G.spin = 0;
    for (let i = 0; i < 2; i++) G.parts.push({ k: 'puff', x: PX, y: G.py, vx: -G.speed * .5, vy: 0, life: 0, max: .35, s: 4 + i * 4 });
    sfx.jump2();
  }
}
function jumpRelease() {
  if (G.state === 'play' && G.vy < -260) G.vy *= .6;
}

function spawn() {
  const x = W + 40;
  let o;
  if (G.score > 120 && Math.random() < .28) {
    const high = Math.random() < .5;
    const bottom = high ? GROUND - 60 : GROUND - 28;
    o = { k: 'bird', x, y: bottom - 26, w: 40, h: 26, ph: Math.random() * 6 };
  } else {
    const n = 1 + Math.floor(Math.random() * (G.score > 300 ? 3 : 2));
    const h = 30 + Math.random() * 22;
    o = { k: 'spike', x, y: GROUND - h, w: n * 22, h, n };
  }
  G.obs.push(o);
  const r = Math.random();
  if (r < .45 && o.k === 'spike') {
    for (let i = -2; i <= 2; i++) G.coins.push({ x: o.x + o.w / 2 + i * 34, y: GROUND - 70 - 78 * (1 - i * i / 6) });
  } else if (r < .8) {
    const start = o.x + o.w + G.speed * .4;
    const y = (o.k === 'bird' && o.y > GROUND - 60) ? GROUND - 130 : GROUND - 22;
    for (let i = 0; i < 5; i++) G.coins.push({ x: start + i * 30, y });
  }
  G.nextSpawn = G.speed * (.85 + Math.random() * .8) + 150 + o.w;
}

function hit(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

function die() {
  G.state = 'over';
  G.overAt = performance.now();
  G.shake = reduceMotion ? 0 : 1;
  sfx.die();
  const bonus = Math.floor(G.score / 40);
  const earned = G.coinsRun + bonus;
  const record = G.score > save.best;
  save.coins += earned;
  if (record) save.best = G.score;
  persist();
  G.lastResult = { score: G.score, picked: G.coinsRun, bonus, earned, record };
  $('pause').hidden = true;
  updateStats();
  renderShop();
  setTimeout(() => { if (G.state === 'over') showOverlay('over'); }, 550);
}

function update(dt) {
  G.t += dt;
  G.squash = Math.max(0, G.squash - dt * 5);
  G.shake = Math.max(0, G.shake - dt * 3);
  if (G.state === 'pause') return;

  if (G.state === 'menu') {
    G.dist += 120 * dt;
    if (save.eq.trail === 'arcenciel') G.hist.push({ d: G.dist, y: G.py - S * .5 });
    emitTrail(G.parts, save.eq.trail, PX - S * .4, G.py - S * .5, true, 120);
  }

  if (G.state === 'play') {
    G.runT += dt;
    G.speed = Math.min(820, 340 + G.runT * 8);
    const dx = G.speed * dt;
    G.dist += dx;
    G.score = Math.floor(G.dist / 12);

    G.vy += GRAV * dt;
    G.py += G.vy * dt;
    if (G.py >= GROUND) {
      if (!G.ground) {
        G.squash = 1;
        for (let i = 0; i < 5; i++) G.parts.push({ k: 'dust', x: PX + rnd(-14, 14), y: GROUND - 4, vx: rnd(-80, 40) - G.speed * .3, vy: rnd(-60, -20), life: 0, max: .4, s: 3 + Math.random() * 3 });
      }
      G.py = GROUND; G.vy = 0; G.ground = true; G.jumps = 0;
    }
    if (G.jumps === 2) G.spin = Math.min(6.283, G.spin + dt * 16);

    G.nextSpawn -= dx;
    if (G.nextSpawn <= 0) spawn();

    for (const o of G.obs) { o.x -= dx; if (o.k === 'bird') o.ph += dt * 14; }
    for (const co of G.coins) co.x -= dx;
    G.obs = G.obs.filter(o => o.x + o.w > -40);
    G.coins = G.coins.filter(co => co.x > -30 && !co.got);

    const pb = { x: PX - S / 2 + 8, y: G.py - S + 8, w: S - 16, h: S - 10 };
    for (const o of G.obs) {
      const ob = o.k === 'spike' ? { x: o.x + 5, y: o.y + 10, w: o.w - 10, h: o.h - 10 } : { x: o.x + 5, y: o.y + 5, w: o.w - 10, h: o.h - 10 };
      if (hit(pb, ob)) { die(); break; }
    }
    const cb = { x: PX - S / 2, y: G.py - S, w: S, h: S };
    for (const co of G.coins) {
      if (!co.got && hit(cb, { x: co.x - 11, y: co.y - 11, w: 22, h: 22 })) {
        co.got = true;
        G.coinsRun++;
        sfx.coin();
        for (let i = 0; i < 6; i++) G.parts.push({ k: 'spark', x: co.x, y: co.y, vx: rnd(-120, 120) - G.speed * .4, vy: rnd(-220, -60), life: 0, max: .45 });
      }
    }
    if (save.eq.trail === 'arcenciel') G.hist.push({ d: G.dist, y: G.py - S * .5 });
    emitTrail(G.parts, save.eq.trail, PX - S * .4, G.py - S * .5, G.ground, G.speed);
  }

  while (G.hist.length && G.dist - G.hist[0].d > PX + 20) G.hist.shift();
  if (G.hist.length > 400) G.hist.splice(0, G.hist.length - 400);
  stepParts(G.parts, dt);
}

function drawObstacles(c, b) {
  for (const o of G.obs) {
    if (o.k === 'spike') {
      for (let i = 0; i < o.n; i++) {
        const x = o.x + i * 22, hh = o.h * (i % 2 ? .82 : 1);
        c.fillStyle = b.obs;
        c.strokeStyle = b.obsHi; c.lineWidth = 2; c.lineJoin = 'round';
        c.beginPath(); c.moveTo(x, GROUND + 1); c.lineTo(x + 11, GROUND - hh); c.lineTo(x + 22, GROUND + 1); c.closePath(); c.fill(); c.stroke();
        c.fillStyle = b.obsHi;
        c.beginPath(); c.moveTo(x + 11, GROUND - hh); c.lineTo(x + 15, GROUND + 1); c.lineTo(x + 11, GROUND + 1); c.closePath(); c.fill();
      }
    } else {
      const flap = Math.sin(o.ph) * 9;
      const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
      c.fillStyle = b.bird;
      c.beginPath(); c.ellipse(cx, cy, 16, 11, 0, 0, 6.283); c.fill();
      c.beginPath(); c.moveTo(cx - 4, cy - 2); c.lineTo(cx + 8, cy - 2); c.lineTo(cx + 2, cy - 4 - flap * 1.4); c.closePath(); c.fill();
      c.fillStyle = '#ff9f43';
      c.beginPath(); c.moveTo(cx - 15, cy - 1); c.lineTo(cx - 24, cy + 2); c.lineTo(cx - 15, cy + 4); c.closePath(); c.fill();
      c.fillStyle = '#fff';
      c.beginPath(); c.arc(cx - 8, cy - 3, 3.5, 0, 6.283); c.fill();
      c.fillStyle = '#1b1433';
      c.beginPath(); c.arc(cx - 9, cy - 3, 1.8, 0, 6.283); c.fill();
    }
  }
}
function drawCoins(c) {
  for (const co of G.coins) {
    const sx = Math.max(.2, Math.abs(Math.cos(G.t * 4 + co.x * .02)));
    c.fillStyle = '#ffd447';
    c.strokeStyle = '#d79a12'; c.lineWidth = 2;
    c.beginPath(); c.ellipse(co.x, co.y, 10 * sx, 10, 0, 0, 6.283); c.fill(); c.stroke();
    c.fillStyle = '#fff4b8';
    c.beginPath(); c.ellipse(co.x - 2 * sx, co.y - 3, 3 * sx, 3, 0, 0, 6.283); c.fill();
  }
}
function drawHud(c) {
  if (G.state === 'menu') return;
  c.save();
  c.font = '24px "Lilita One", "Arial Rounded MT Bold", sans-serif';
  c.textBaseline = 'top';
  c.fillStyle = 'rgba(0,0,0,.28)';
  c.fillText(fmt(G.score) + ' m', 16, 14);
  c.fillStyle = '#ffffff';
  c.fillText(fmt(G.score) + ' m', 14, 12);
  const label = fmt(G.coinsRun);
  c.fillStyle = '#ffd447'; c.strokeStyle = '#d79a12'; c.lineWidth = 2;
  c.beginPath(); c.arc(24, 54, 9, 0, 6.283); c.fill(); c.stroke();
  c.font = '20px "Lilita One", "Arial Rounded MT Bold", sans-serif';
  c.fillStyle = '#ffffff';
  c.fillText(label, 40, 44);
  c.restore();
}

function render() {
  const b = BG[save.eq.bg] || BG.crepuscule;
  ctx.save();
  if (G.shake > 0) ctx.translate(rnd(-1, 1) * 8 * G.shake, rnd(-1, 1) * 6 * G.shake);
  drawScene(ctx, W, H, save.eq.bg, G.dist, G.t, GROUND);
  drawCoins(ctx);
  drawObstacles(ctx, b);
  if (save.eq.trail === 'arcenciel') drawRainbow(ctx, G.hist, PX - S * .3, G.dist);
  drawParts(ctx, G.parts, save.eq.bg);
  const runPhase = (G.dist / 9) % 6.283;
  drawChar(ctx, PX, G.py, S, G.t, save.eq, {
    run: G.state === 'over' ? 0 : runPhase,
    air: !G.ground,
    squash: G.squash,
    spin: G.jumps === 2 && G.spin < 6.283 ? G.spin : 0,
  });
  ctx.restore();
  drawHud(ctx);
}

let last = 0;
function frame(now) {
  const dt = Math.min(.033, (now - (last || now)) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

// ---------- Écrans superposés ----------
const overlay = $('overlay');
function showOverlay(kind) {
  overlay.hidden = !kind;
  if (!kind) return;
  if (kind === 'menu') {
    overlay.innerHTML = `<div class="overlay-card">
      <h2>Pépin Sprint</h2>
      <p>Saute par-dessus les pics, évite les oiseaux et ramasse un maximum de pièces.</p>
      <button class="btn" type="button" data-act="play">Jouer</button>
      <p class="hint"><kbd>Espace</kbd> ou toucher l’écran pour sauter. Appuie deux fois pour un double saut.</p>
    </div>`;
  } else if (kind === 'pause') {
    overlay.innerHTML = `<div class="overlay-card">
      <h2>Pause</h2>
      <p class="big">${fmt(G.score)} m</p>
      <button class="btn" type="button" data-act="resume">Reprendre</button>
    </div>`;
  } else if (kind === 'over') {
    const r = G.lastResult;
    overlay.innerHTML = `<div class="overlay-card">
      ${r.record ? '<span class="record">Nouveau record</span>' : ''}
      <h2>Aïe !</h2>
      <p class="big">${fmt(r.score)} m</p>
      <p>+${fmt(r.earned)} pièces : ${fmt(r.picked)} ramassées et ${fmt(r.bonus)} de bonus distance</p>
      <div class="row">
        <button class="btn" type="button" data-act="play">Rejouer</button>
        <button class="btn ghost" type="button" data-act="shop">Boutique</button>
      </div>
    </div>`;
  }
}
overlay.addEventListener('click', e => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'play') startRun();
  else if (act === 'resume') resume();
  else if (act === 'shop') $('shop').scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth' });
});
function pauseGame() {
  if (G.state !== 'play') return;
  G.state = 'pause';
  $('pause').hidden = true;
  showOverlay('pause');
}
function resume() {
  if (G.state !== 'pause') return;
  G.state = 'play';
  $('pause').hidden = false;
  showOverlay(null);
}

// ---------- Contrôles ----------
const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW'];
window.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (JUMP_KEYS.includes(e.code)) {
    if (!$('modal').hidden) return;
    if (G.state === 'play') { e.preventDefault(); if (!e.repeat) jumpPress(); return; }
    if (tag === 'BUTTON' || tag === 'INPUT') return;
    if (G.state === 'menu' || (G.state === 'over' && performance.now() - G.overAt > 600)) { e.preventDefault(); startRun(); }
    else if (G.state === 'pause') { e.preventDefault(); resume(); }
  } else if (e.code === 'KeyP' || e.code === 'Escape') {
    if (G.state === 'play') pauseGame();
    else if (G.state === 'pause') resume();
  }
});
window.addEventListener('keyup', e => { if (JUMP_KEYS.includes(e.code)) jumpRelease(); });
$('screen').addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  if (G.state === 'play') { e.preventDefault(); jumpPress(); }
  else if (G.state === 'menu' || (G.state === 'over' && performance.now() - G.overAt > 600)) startRun();
  else if (G.state === 'pause') resume();
});
window.addEventListener('pointerup', jumpRelease);
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
$('pause').addEventListener('click', pauseGame);
$('mute').addEventListener('click', () => {
  save.muted = !save.muted;
  persist();
  $('mute').textContent = save.muted ? 'Son : non' : 'Son : oui';
});

// ---------- Boutique ----------
let tab = 'skin';
try { const t = localStorage.getItem(KEY + '-tab'); if (CAT[t]) tab = t; } catch (e) { /* rien */ }
const CHEST_PRICE = 200;

function updateStats() {
  $('coins').textContent = fmt(save.coins);
  $('best').textContent = fmt(save.best) + ' m';
  $('mute').textContent = save.muted ? 'Son : non' : 'Son : oui';
}
function renderTabs() {
  $('tabs').innerHTML = CATS.map(c => `<button class="tab" role="tab" type="button" id="tab-${c.id}" data-tab="${c.id}" aria-selected="${c.id === tab}">${c.label}<span class="count">${save.owned[c.id].length}/${CAT[c.id].length}</span></button>`).join('');
}
function renderShop() {
  renderTabs();
  const grid = $('grid');
  grid.setAttribute('aria-labelledby', 'tab-' + tab);
  grid.innerHTML = '';
  for (const it of CAT[tab]) {
    const owned = save.owned[tab].includes(it.id);
    const eq = save.eq[tab] === it.id;
    const card = document.createElement('div');
    card.className = 'item' + (eq ? ' equipped' : '');
    const cvs = document.createElement('canvas');
    cvs.setAttribute('aria-hidden', 'true');
    card.appendChild(cvs);
    const top = document.createElement('div');
    top.className = 'item-top';
    top.innerHTML = `<span class="name">${it.name}</span><span class="chip r-${it.rar}">${RAR[it.rar].label}</span>`;
    card.appendChild(top);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn small' + (eq || owned ? ' ghost' : '');
    btn.dataset.id = it.id;
    if (eq) { btn.textContent = 'Équipé'; btn.disabled = true; }
    else if (owned) { btn.textContent = 'Équiper'; btn.dataset.act = 'equip'; }
    else {
      btn.innerHTML = `<span class="coin-ico" aria-hidden="true"></span>${fmt(it.price)}`;
      btn.setAttribute('aria-label', `Acheter ${it.name} pour ${it.price} pièces`);
      btn.dataset.act = 'buy';
      if (save.coins < it.price) { btn.disabled = true; btn.title = `Il te manque ${it.price - save.coins} pièces`; }
    }
    card.appendChild(btn);
    grid.appendChild(card);
    renderPreview(cvs, tab, it.id);
  }
  const chestBtn = $('open-chest');
  const left = CATS.reduce((n, c) => n + CAT[c.id].length - save.owned[c.id].length, 0);
  chestBtn.innerHTML = left ? `<span class="coin-ico" aria-hidden="true"></span> Ouvrir · ${CHEST_PRICE}` : 'Tout est débloqué';
  chestBtn.disabled = !left || save.coins < CHEST_PRICE;
}
$('tabs').addEventListener('click', e => {
  const t = e.target.closest('[data-tab]')?.dataset.tab;
  if (!t || t === tab) return;
  tab = t;
  try { localStorage.setItem(KEY + '-tab', t); } catch (err) { /* rien */ }
  renderShop();
});
$('grid').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const it = find(tab, b.dataset.id);
  if (b.dataset.act === 'buy') {
    if (save.coins < it.price) return;
    save.coins -= it.price;
    save.owned[tab].push(it.id);
    save.eq[tab] = it.id;
    sfx.buy();
    toast(`${it.name} acheté et équipé`);
  } else {
    save.eq[tab] = it.id;
    toast(`${it.name} équipé`);
  }
  if (tab === 'trail') { G.parts = []; G.hist = []; }
  persist();
  updateStats();
  renderShop();
  $('grid').querySelector(`[data-id="${it.id}"]`)?.focus({ preventScroll: true });
});

let toastTimer = 0;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 1800);
}

// Coffre mystère
let revealed = null;
function rollChest() {
  const pool = {};
  for (const c of CATS) for (const it of CAT[c.id]) {
    if (!save.owned[c.id].includes(it.id)) (pool[it.rar] = pool[it.rar] || []).push({ cat: c.id, it });
  }
  const rars = Object.keys(pool);
  if (!rars.length) return null;
  const total = rars.reduce((s, r) => s + RAR[r].weight, 0);
  let x = Math.random() * total;
  for (const r of rars) {
    x -= RAR[r].weight;
    if (x <= 0) return pick(pool[r]);
  }
  return pick(pool[rars[rars.length - 1]]);
}
$('open-chest').addEventListener('click', () => {
  if (save.coins < CHEST_PRICE) return;
  const got = rollChest();
  if (!got) return;
  save.coins -= CHEST_PRICE;
  save.owned[got.cat].push(got.it.id);
  persist();
  updateStats();
  revealed = got;
  const modal = $('modal'), card = modal.querySelector('.modal-card');
  const cvs = $('reveal');
  card.classList.remove('glow');
  card.style.color = '';
  modal.hidden = false;
  $('reveal-name').textContent = 'Ouverture…';
  $('reveal-chip').hidden = true;
  $('reveal-cat').textContent = '';
  $('reveal-equip').hidden = true;
  const c = cvs.getContext('2d');
  cvs.width = 520; cvs.height = 390;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.fillStyle = '#31275c'; c.fillRect(0, 0, 520, 390);
  c.drawImage($('chest-art'), 188, 140, 144, 120);
  cvs.classList.add('shaking');
  $('reveal-close').focus();
  setTimeout(() => {
    cvs.classList.remove('shaking');
    renderPreview(cvs, got.cat, got.it.id, 260, 195);
    const chip = $('reveal-chip');
    chip.hidden = false;
    chip.className = 'chip r-' + got.it.rar;
    chip.textContent = RAR[got.it.rar].label;
    $('reveal-name').textContent = got.it.name;
    $('reveal-cat').textContent = CATS.find(c => c.id === got.cat).one + ' · nouveau';
    $('reveal-equip').hidden = false;
    card.className = 'modal-card glow r-' + got.it.rar;
    sfx.chest();
    renderShop();
  }, reduceMotion ? 150 : 900);
});
function closeModal() {
  $('modal').hidden = true;
  $('modal').querySelector('.modal-card').className = 'modal-card';
  $('open-chest').focus({ preventScroll: true });
}
$('reveal-close').addEventListener('click', closeModal);
$('reveal-equip').addEventListener('click', () => {
  if (!revealed) return;
  save.eq[revealed.cat] = revealed.it.id;
  if (revealed.cat === 'trail') { G.parts = []; G.hist = []; }
  persist();
  tab = revealed.cat;
  toast(`${revealed.it.name} équipé`);
  renderShop();
  closeModal();
});
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
window.addEventListener('keydown', e => { if (e.code === 'Escape' && !$('modal').hidden) closeModal(); });

// ---------- Démarrage ----------
function boot(data) {
  if (data && data.save) save = normalize(data.save);
  resize();
  drawChestArt();
  updateStats();
  renderShop();
  showOverlay('menu');
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => renderShop());
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ save }));
if (hot && typeof hot.ready === 'function') hot.ready(boot);
else boot((hot && hot.data) || {});
})();
</script>
